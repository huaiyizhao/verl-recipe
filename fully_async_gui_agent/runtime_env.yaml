working_dir: ./
excludes: ["/.git/", "/val_outputs/", "/wandb/"]
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  HCCL_HOST_SOCKET_PORT_RANGE: "auto"
  HCCL_NPU_SOCKET_PORT_RANGE: "auto"
  FI_PROVIDER: efa
  FI_EFA_USE_DEVICE_RDMA: "1"
  FI_EFA_SET_DEFAULT_GDR: "1"
  NCCL_NVLS_ENABLE: "1"
  NCCL_MIN_NCHANNELS: "32"
  NCCL_IB_HCA: ^mlx5_bond_0,lo
  NCCL_DEBUG: INFO
  PYTHONPATH: .
  # Needed by Ray workers on all nodes
  DESKTOP_API_BASE_URL: "http://172.31.13.38:2354"
  # Ray enables uvloop by default when the package is installed. Disable it to
  # avoid uvloop/aiohttp fd ownership bugs under timeout/retry-heavy rollouts.
  RAY_USE_UVLOOP: "0"
  VLLM_USE_V1: "1"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  # Node-role resources are advertised at `ray start --resources=...`; these
  # env vars tell verl which resource names to request for rollout-side actors.
  VERL_ROLLOUT_NODE_RESOURCE: "rollout_node"
  VERL_TRAIN_NODE_RESOURCE: "train_node"
  # TransferQueue SimpleStorage placement/data-plane defaults. Storage units are
  # balanced across Ray nodes; image payloads are stored as compressed bytes and
  # re-processed on the trainer side.
  VERL_TQ_STORAGE_PLACEMENT: "balanced"
  VERL_TQ_STORAGE_BALANCE_RESOURCE: "none"
  VERL_TQ_STORAGE_NODE_RESOURCE: "none"
  VERL_TQ_STORAGE_RESOURCE_AMOUNT: "0.001"
  VERL_TQ_IMAGE_FORMAT: "PNG"
  VERL_TQ_IMAGE_PNG_COMPRESS_LEVEL: "1"
  VERL_TRAIN_TIMING_LOG: "1"
  VERL_TRAIN_TIMING_RANKS: "0,4,8,12"
  # Tensor-level trainer GPU diagnostics. Each rank logs only its first few
  # train batches/microbatches to expose BSHD padding amplification and logits size.
  VERL_TRAIN_MEM_DEBUG: "1"
  VERL_TRAIN_MEM_DEBUG_RANKS: "all"
  VERL_TRAIN_MEM_DEBUG_MAX: "8"
  # Heavy custom diagnostics ([POSTPROC_PROFILE], [MATERIALIZE_PROFILE],
  # [RESOLVE_PROFILE], etc.). Keep off unless chasing a correctness bug.
  VERL_PROFILE: "0"
  # Lightweight step/sample timing ([SAMPLE_PROFILE], [RESOLVE_PROFILE],
  # [FBP_PROFILE]). Keep off for normal training logs.
  VERL_STEP_PROFILE: "0"
  # Rollout-vs-train logprob diagnostics. Keep the lightweight LOGPROB_GAP
  # prints on; leave the heavy one-shot probe disabled unless explicitly needed.
  VERL_LOGPROB_DEBUG: "1"
  VERL_LOGPROB_DEBUG_MAX: "8"
  VERL_LOGPROB_DEBUG_HIGH_MAX: "80"
  VERL_LOGPROB_DEBUG_THRESHOLD: "0.005"
  VERL_LOGPROB_PROBE_DUMP: "0"
  VERL_LOGPROB_PROBE_REF: "0"
  VERL_LOGPROB_PROBE_MAX: "1"
  VERL_LOGPROB_PROBE_MIN_K3: "0.005"
  VERL_LOGPROB_PROBE_TOPK: "5"
  VERL_LOGPROB_PROBE_DIR: "/efs/data/rl/logprob_probe_fsdp"
  VERL_LOGPROB_PROBE_LOGPROBS_MODE: "raw_logprobs"
  VERL_LOGGING_LEVEL: "DEBUG"
  # Train-side pixel integrity self-check in resolve_image_ids (dedup consume).
  # Keep off by default; enable only when chasing image-store corruption.
  VERL_PIXEL_FINGERPRINT: "0"
  VERL_IMAGE_REF_STORAGE_MODE: "per_image"
  WANDB_API_KEY: "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"
  MLFLOW_TRACKING_URI: "http://172.20.70.149:29004"  # MLflow server 地址
  HF_HOME: "/efs/data/hf"

  # --- Ray/gRPC SIGABRT mitigation ---------------------------------
  # The core-worker's gRPC IO thread has been observed to abort inside
  # ``uv__epoll_ctl_flush`` after ~1h of sustained task-event traffic.
  # Switching gRPC off the epollex engine and lowering task-event
  # reporting frequency both reduce the pressure on that code path.
  GRPC_POLL_STRATEGY: "poll"
  GRPC_VERBOSITY: "ERROR"
  RAY_task_events_report_interval_ms: "10000"
  RAY_task_events_max_num_status_events_buffer_on_worker: "1024"
  RAY_RAYLET_ULIMIT_NOFILE: "1048576"
