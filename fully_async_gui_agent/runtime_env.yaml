working_dir: ./
excludes: ["/.git/", "/val_outputs/", "/wandb/"]
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  HCCL_HOST_SOCKET_PORT_RANGE: "auto"
  HCCL_NPU_SOCKET_PORT_RANGE: "auto"
  FI_PROVIDER: efa
  FI_EFA_USE_DEVICE_RDMA: "1"
  FI_EFA_SET_DEFAULT_GDR: "1"
  NCCL_NVLS_ENABLE: "1"
  NCCL_MIN_NCHANNELS: "32"
  NCCL_IB_HCA: ^mlx5_bond_0,lo
  NCCL_DEBUG: INFO
  PYTHONPATH: .
  # Needed by Ray workers on all nodes
  DESKTOP_API_BASE_URL: "http://172.31.13.38:2354"
  # Ray enables uvloop by default when the package is installed. Disable it to
  # avoid uvloop/aiohttp fd ownership bugs under timeout/retry-heavy rollouts.
  RAY_USE_UVLOOP: "0"
  VLLM_USE_V1: "1"
  PYTORCH_ALLOC_CONF: "expandable_segments:True"
  VERL_TRAIN_TIMING_LOG: "1"
  VERL_TRAIN_TIMING_RANKS: "0,4,8,12"
  # VERL_PROFILE: master switch for the HEAVY custom diagnostics — rollout-worker postprocess
  # ([POSTPROC_PROFILE]), forward-pass per-row image check ([MM_ROWCHECK]), materialization
  # ([MATERIALIZE_PROFILE]) and dedup resolve ([RESOLVE_PROFILE]). These add overhead and skew the
  # timing, so keep it OFF while measuring step speed; flip to "1" only to chase a dedup/correctness bug.
  # ON now for the train<->infer divergence hunt: enables [MM_ROWCHECK] (detects dedup image
  # misalignment/wrap — the prime suspect) plus [MATERIALIZE_PROFILE]/[RESOLVE_PROFILE]/[POSTPROC_PROFILE].
  VERL_PROFILE: "1"
  # Lightweight per-step / per-sample timing breakdown ([STEP_PROFILE] / [SAMPLE_PROFILE]) plus
  # [FBP_PROFILE]. ON for the localization pass.
  VERL_STEP_PROFILE: "1"
  # Model dir for the LOGPROB_GAP diagnostic to lazily load a tokenizer and print DECODED token
  # text inline (worst token + per-token dump), instead of raw ids you'd decode by hand.
  VERL_LOGPROB_DEBUG_TOKENIZER: "/efs/data/models/Qwen3-VL-8B-Instruct"
  # One-shot root-cause probe: dump ONE real micro-batch (inputs + vLLM logp + FSDP logp) to disk
  # so vLLM<->FSDP logprob divergence can be localized OFFLINE in a single run. Analyze with
  # recipe/fully_async_gui_agent/logprob_rootcause_probe.py on the GPU box after the run.
  VERL_LOGPROB_PROBE_DUMP: "1"
  # New dir so we DON'T overwrite the unmasked bundle at /efs/data/rl/logprob_probe (keep for compare).
  VERL_LOGPROB_PROBE_DIR: "/efs/data/rl/logprob_probe_masked"
  VERL_LOGPROB_PROBE_MAX: "1"
  # Only dump a micro-batch whose max per-seq mean-k3 >= this (RS mask fires at 0.005) -> a MASKED batch.
  VERL_LOGPROB_PROBE_MIN_K3: "0.006"
  VERL_LOGGING_LEVEL: "DEBUG"
  VERL_IMAGE_REF_STORAGE_MODE: "per_image"
  WANDB_API_KEY: "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"
  VERL_LOGGING_LEVEL: "DEBUG"
  MLFLOW_TRACKING_URI: "http://172.20.70.149:29004"  # MLflow server 地址
  HF_HOME: "/efs/data/hf"

  # --- Ray/gRPC SIGABRT mitigation ---------------------------------
  # The core-worker's gRPC IO thread has been observed to abort inside
  # ``uv__epoll_ctl_flush`` after ~1h of sustained task-event traffic.
  # Switching gRPC off the epollex engine and lowering task-event
  # reporting frequency both reduce the pressure on that code path.
  GRPC_POLL_STRATEGY: "poll"
  GRPC_VERBOSITY: "ERROR"
  RAY_task_events_report_interval_ms: "10000"
  RAY_task_events_max_num_status_events_buffer_on_worker: "1024"
  RAY_RAYLET_ULIMIT_NOFILE: "1048576"
