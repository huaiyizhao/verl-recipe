tools:
  # Session-based HTTP desktop environment tool for GUI Agent training.
  # Communicates with an externally-managed desktop service via:
  #   POST /session/create, /session/{id}/step, /session/{id}/evaluate, /session/{id}/close
  # Env var DESKTOP_API_BASE_URL (default http://localhost:2354) selects the service.
  - class_name: "recipe.fully_async_gui_agent.desktop_env_tool.DesktopEnvTool"
    config:
      type: native
      api_base_url: ${oc.env:DESKTOP_API_BASE_URL,http://localhost:2354}
      screen_width: 1000   # shown to the model in the prompt (Qwen-VL normalized space)
      screen_height: 1000  # shown to the model in the prompt (Qwen-VL normalized space)
      real_screen_width: 1920   # actual desktop resolution for coordinate denormalization
      real_screen_height: 1080  # actual desktop resolution for coordinate denormalization
      timeout: 30
      create_timeout: 600  # /session/create may need longer for container/session startup
      http_keepalive_timeout: 30  # keep idle TCP connections within one rollout for up to 30s
      http_session_max_age: 0     # 0 disables age-based ClientSession reset; release closes it
      http_force_close: false     # keep ClientSession/TCP pooling enabled within a rollout
      pause: 2.0
      evaluate_settle_seconds: 10
      step_reward: 0.0
