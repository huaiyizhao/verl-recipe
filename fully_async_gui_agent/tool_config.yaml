tools:
  # Session-based HTTP desktop environment tool for GUI Agent training.
  # Communicates with an externally-managed desktop service via:
  #   POST /session/create, /session/{id}/step, /session/{id}/evaluate, /session/{id}/close
  # Env var DESKTOP_API_BASE_URL (default http://localhost:2354) selects the service.
  - class_name: "recipe.fully_async_gui_agent.desktop_env_tool.DesktopEnvTool"
    config:
      type: native
      api_base_url: ${oc.env:DESKTOP_API_BASE_URL,http://localhost:2354}
      auth_token: ${oc.env:DESKTOP_API_AUTH_TOKEN,''}
      screen_width: 1000   # shown to the model in the prompt (Qwen-VL normalized space)
      screen_height: 1000  # shown to the model in the prompt (Qwen-VL normalized space)
      real_screen_width: 1920   # actual desktop resolution for coordinate denormalization
      real_screen_height: 1080  # actual desktop resolution for coordinate denormalization
      close_timeout: 60
      connect_timeout: 10
      create_timeout: 1800
      step_timeout: 400
      step_server_timeout: 360
      evaluate_timeout: 605
      evaluate_server_timeout: 600
      max_retries: 1
      connect_max_retries: 3
      connect_retry_jitter_min: 3
      connect_retry_jitter_max: 8
      retry_interval: 30
      create_jitter_seconds: 5
      max_concurrent_sessions: 160
      concurrency_limiter_name: gui_agent_desktop_env_limiter
      create_status_max_retries: 1
      create_status_retry_interval: 30
      create_retry_statuses: [429, 500, 502, 503, 504]
      # B2 routes step/evaluate directly to each session's own worker port, so
      # connections spread across workers (each serving ~1 at a time) — per-request
      # short connections are not a bottleneck, so reuse stays off (also avoids
      # long-lived keep-alive conns going half-open through NAT). create/close
      # still go to the central service.
      http_reuse_session: false
      http_force_close: true
      pause: 2.0
      evaluate_settle_seconds: 3
      step_reward: 0.0
